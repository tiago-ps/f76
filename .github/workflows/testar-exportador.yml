name: Testar exportador do inventário Fallout 76

on:
  push:
    branches:
      - sheets-integration-foundation
    paths:
      - "integracao-arquivos/exportar_inventario.py"
      - ".github/workflows/testar-exportador.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testar-exportador:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Criar arquivo de teste sintético
        run: |
          cat > itemsmod-teste.json <<'JSON'
          {
            "version": "teste",
            "characterInventories": {
              "PersonagemTeste": {
                "playerInventory": [
                  {
                    "text": "Arma de teste",
                    "filterFlag": 4,
                    "damage": 50,
                    "count": 1,
                    "itemLevel": 50,
                    "numLegendaryStars": 1,
                    "ItemCardEntries": [
                      {"text": "DESC", "value": "Efeito lendário de teste\nDescrição adicional"}
                    ]
                  },
                  {
                    "text": "Item que não é arma",
                    "filterFlag": 4,
                    "damage": 0,
                    "count": 1
                  },
                  {
                    "text": "++++ ¢",
                    "filterFlag": 6,
                    "damage": 10,
                    "count": 1
                  }
                ],
                "stashInventory": [
                  {
                    "text": "Outra arma de teste",
                    "filterFlag": 5,
                    "damage": 25,
                    "count": 2,
                    "itemLevel": 45,
                    "numLegendaryStars": 0
                  }
                ],
                "AccountInfoData": {"name": "NAO_EXPORTAR_CONTA"},
                "CharacterInfoData": {"name": "NAO_EXPORTAR_PERSONAGEM"}
              }
            }
          }
          JSON

      - name: Executar exportador
        run: |
          python integracao-arquivos/exportar_inventario.py itemsmod-teste.json --output inventario-teste.js

      - name: Validar resultado e privacidade
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          text = Path("inventario-teste.js").read_text(encoding="utf-8")
          payload = json.loads(text.split("window.F76_INVENTARIO = ", 1)[1].rsplit(";", 1)[0])

          assert payload["count"] == 3, payload["count"]
          assert payload["countsByLocation"] == {"personagem": 2, "bau": 1}
          assert payload["records"][0]["effects"] == ["Efeito lendário de teste"]
          assert any(item["name"] == "++++ ¢" and item["catalogKey"] == "++++ ¢" for item in payload["records"])
          assert "NAO_EXPORTAR_CONTA" not in text
          assert "NAO_EXPORTAR_PERSONAGEM" not in text
          assert "serverHandleID" not in text
          assert "containerID" not in text
          print("OK: contagem, locais, efeitos e exclusão de identificadores.")
          PY

      - name: Guardar resultado sintético para inspeção
        uses: actions/upload-artifact@v4
        with:
          name: inventario-teste-sintetico
          path: inventario-teste.js
          retention-days: 3
